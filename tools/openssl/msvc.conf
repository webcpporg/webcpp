# Keep B2's runtime and debug configuration. Upstream otherwise forces /MT
# and /Zi for static objects, even when their consumer selected /MDd or /Z7.
my %targets = (
    "VC-WIN32-webcpp" => {
        inherit_from => [ "VC-WIN32" ],
        lib_cflags => "/Zl /Fdossl_static.pdb",
    },
    "VC-WIN64A-webcpp" => {
        inherit_from => [ "VC-WIN64A" ],
        lib_cflags => "/Zl /Fdossl_static.pdb",
    },
    "VC-WIN64-ARM-webcpp" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        lib_cflags => "/Zl /Fdossl_static.pdb",
    },
);

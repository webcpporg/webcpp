name: GCC 15.3
description: Install the pinned official GCC toolchain and verify coroutine support.
runs:
  using: composite
  steps:
    - name: Restore the pinned GCC toolchain
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .local/gcc-15.3.0
        key: gcc-15.3.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/actions/gcc/**') }}
    - name: Install and verify GCC 15.3
      shell: bash
      run: python3 tools/ci/actions/gcc/install.py
    - name: Cache the verified GCC toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .local/gcc-15.3.0
        key: ${{ steps.cache.outputs.cache-primary-key }}

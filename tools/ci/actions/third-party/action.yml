name: Third-party builds
description: >-
  Restores, before a job's b2, and saves, after it, the configurations of the source-built OpenSSL
  and libdatachannel under bin/third_party, which B2 names by the bytes of their inputs and by
  their build command and never builds again, b2 -a included (tools/webcpp-third-party.jam): a job
  builds only the configurations its cache does not hold. The cache is the job's own, on its runner
  image, and starts afresh when an input of those builds or a pinned toolchain changes. A job saves
  it only when it built a configuration the cache did not hold, under the hash of the
  configurations' names.

inputs:
  step:
    description: restore, before the job's b2, or save, after it.
    required: true
  job:
    description: What keys the cache, such as the lane's id.
    required: true

runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      env:
        JOB: ${{ inputs.job }}
        INPUTS: >-
          ${{ hashFiles('tools/openssl/build.py', 'tools/openssl/source.py',
          'tools/openssl/pin.json', 'tools/openssl/msvc.conf', 'tools/openssl/wasip3.conf',
          'tools/libdatachannel/build.py', 'tools/libdatachannel/source.py',
          'tools/libdatachannel/pin.json', 'tools/libdatachannel/msvc.cmake',
          'tools/third_party_build.py', 'tools/webcpp-third-party.jam', 'tools/webcpp-openssl.jam',
          'tools/webcpp-libdatachannel.jam', 'tools/ci/actions/third-party/**',
          'tools/ci/actions/gcc/**', 'tools/ci/actions/wasi-sdk/**', 'tools/ci/actions/emsdk/**',
          'tools/ci/actions/container/**', 'tools/ci/container/**') }}
      run: bash tools/ci/actions/third-party/key.sh

    - name: Restore the third-party builds
      id: restore
      if: inputs.step == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          bin/third_party/openssl
          bin/third_party/libdatachannel
        key: ${{ steps.key.outputs.prefix }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Record the restored builds
      if: inputs.step == 'restore'
      shell: bash
      env:
        RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
      run: echo "WEBCPP_THIRD_PARTY_RESTORED=$RESTORED" >> "$GITHUB_ENV"

    - name: Save the third-party builds
      if: >-
        inputs.step == 'save' && steps.key.outputs.built == 'true'
        && steps.key.outputs.key != env.WEBCPP_THIRD_PARTY_RESTORED
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          bin/third_party/openssl
          bin/third_party/libdatachannel
        key: ${{ steps.key.outputs.key }}

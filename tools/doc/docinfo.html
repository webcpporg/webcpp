The style every page adds to Asciidoctor's, in its head (docinfo=shared).
-->
<style>
/* Room for a line of the examples, which clang-format keeps within 100 columns, without
   scrolling. */
#header, #content, #footnotes, #footer { max-width: 66em; }
/* The system's fonts, as the test report's pages use: Asciidoctor's style asks for Noto Serif,
   Open Sans and Droid Sans Mono, which webfonts! keeps from being downloaded, so a page would
   otherwise show whatever serif the system falls back to. */
body, h1, h2, h3, h4, h5, h6, #toctitle, #toc ul, #content .title, .conum[data-value],
.verseblock pre {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
code, kbd, pre, samp {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
/* The links of a reference's title, to the scopes its name is in, read as the title does. */
#content :is(h2, h3, h4, h5, h6) a:not(.anchor) { color: inherit; text-decoration: none; }
#content :is(h2, h3, h4, h5, h6) a:not(.anchor):hover { text-decoration: underline; }
/* The block's own background shows behind the highlighted code. */
.listingblock > .content > pre.highlight { background: #f7f7f8; }
pre.highlight > code.hljs { background: none; padding: 0; }
/* Code inside a link reads as part of the link, with no box of its own to break its underline. */
#content a > code { padding: 0; background: none; color: inherit; }
/* A link's underline is drawn below the underscores of a name of code, not over them: at its
   default height it covers them, and `WEBCPP_CRYPTO_DEFAULT` reads as three words. */
#content a:has(> code), #content code a { text-underline-offset: .3em; }
/* A line of code stays whole and scrolls, as it reads in an editor. */
.listingblock pre, .literalblock pre {
  white-space: pre;
  word-wrap: normal;
  overflow-x: auto;
}
/* Inline exported plots have fixed point dimensions. Fit the available column
   without changing their viewBox, aspect ratio or underlying measurement data. */
.imageblock > .content > svg {
  max-width: 100%;
  height: auto;
}
/* Where the table of contents stands at the left of the content, from 768px, Asciidoctor leaves
   the content 15px of room at its right, against the table's 240px, 320px from 1280px. The
   content gets a gutter there taken from the table's width, whose entries keep their lines: the
   content keeps its width, so that every line of it, a line of 100 columns among them, breaks
   where it did. */
@media screen and (min-width: 48em) {
  body.toc2.toc-left { padding-left: 14em; padding-right: 1em; }
  body.toc2.toc-left #toc.toc2 { width: 14em; }
}
@media screen and (min-width: 80em) {
  body.toc2.toc-left { padding-left: 18em; padding-right: 2em; }
  body.toc2.toc-left #toc.toc2 { width: 18em; }
}
/* From 1280px, Asciidoctor sets a listing in 1em while a table of contents at the side takes
   20em of the width, so a line of 100 columns would scroll in a window narrower than 1345px. On a
   page with that table, its size from 768px, .90625em, keeps such a line whole from 1280px on. */
@media screen and (min-width: 80em) {
  body.toc2 .literalblock pre, body.toc2 .listingblock > .content > pre { font-size: .90625em; }
}
/* Code in a sentence has a box narrow enough that a comma or a period after it stays close, and
   the same box in a table cell, alone in the cell or not. */
:not(pre):not([class^=L]) > code { padding: .1em .2ex; }
#content p.tableblock > code:only-child { background: #f7f7f8; padding: .1em .2ex; }
/* A word breaks between two letters only when it is wider than its line: Asciidoctor's style
   lets the text of the page, of a cell and of a note break anywhere (overflow-wrap: anywhere),
   which a phone's narrow line does inside a name. A name of code breaks between its parts, where
   postprocess.mjs marks them, and a part still wider than the line breaks where it must, so that
   the page never scrolls sideways. */
body, td.tableblock > .content, td.hdlist2, .admonitionblock > table td.content {
  overflow-wrap: break-word;
}
/* Inline code breaks between its words (postprocess.mjs), never inside one, at a hyphen as
   `--recursive` would or elsewhere, on a screen wide enough for its longest word; in a table at
   every width, where it breaks only as the table's box allows (below). A word short enough
   for a phone's line, which postprocess.mjs marks whole, stays on one line at any width: without
   it, a phone would break `#xactor-invariant-13` at a hyphen though the word fits the line. On a
   phone, a longer word breaks between its parts, at the span.wbr postprocess.mjs marks, whose
   zero-width space, generated here, breaks the line and is never copied. From 600px, whose line
   holds such a word whole, a break of inline code is no box, and so is a break between two parts
   of a name in a heading or a URL, span.wbr.part: the name moves whole to the next line rather
   than break at the end of one, and a table's column keeps room for it. A heading's break after
   a ::, a plain span.wbr, stays at every width. The space's alternative text is empty, so that
   a screen reader reads the name whole; an engine that does not know it keeps the first
   declaration. */
span.wbr::after { content: "\200B"; content: "\200B" / ""; }
@media screen and (min-width: 56.25em) {
  :not(pre):not([class^=L]) > code { white-space: nowrap; }
  :not(pre):not([class^=L]) > code.words { white-space: normal; }
  code.words > span { white-space: nowrap; }
}
@media screen and (min-width: 37.5em) {
  #content :not(pre):not([class^=L]) > code span.wbr, span.wbr.part { display: none; }
}
/* In a table, a name of code breaks only where the page's script finds the table too wide for
   its box with its names whole, and then in two steps: first only after a :: and between two
   names, never inside a word, such as at the _ of `aes256_gcm` or the - of an example's name;
   then, only where the table is too wide even so, between the other parts of its names too, where
   postprocess.mjs marks them, a column then as narrow as the longest part of its names. Its box
   marked names, then parts, by the script. A name stays on one line between those breaks: the
   style keeps inline code in a table on one line at every width, and a break postprocess.mjs
   marks is the one place it wraps, its zero-width space breaking the line where the break is
   live. A table of the role wrap-names keeps its breaks after a :: live at every width; one of
   the role key-column breaks short names too, which postprocess.mjs marks in such a table. A
   table still too wide stacks (below); one stacked and still wider than its box, for a part wider
   than a card, its box marked loose, lets its code wrap where it must, as prose does. */
#content table.tableblock :not(pre):not([class^=L]) > code,
#content table.tableblock code.words > span { white-space: nowrap; }
#content table.tableblock :not(pre):not([class^=L]) > code.words { white-space: normal; }
#content table.tableblock code span.wbr { display: none; white-space: normal; }
#content .table-scroll.names > table.tableblock code span.wbr:not(.part),
#content .table-scroll.names > table.tableblock code span.wbr.path,
#content table.tableblock.wrap-names code span.wbr:not(.part),
#content table.tableblock.wrap-names code span.wbr.path,
#content .table-scroll.parts > table.tableblock code span.wbr { display: inline; }
#content .table-scroll.loose > table.tableblock :not(pre):not([class^=L]) > code,
#content .table-scroll.loose > table.tableblock code.words > span {
  white-space: normal; overflow-wrap: break-word;
}
#content .table-scroll.loose > table.tableblock code span.wbr { display: inline; }
/* A word a phone keeps whole, code.whole (postprocess.mjs), stays on one line at every width. */
#content code.whole, #content code.words > span.whole { white-space: nowrap; }
/* Inline code of the role keep, such as a target or a file a reader copies, stays on one line at
   every width, in a table too: postprocess.mjs marks no part in it. */
#content code.keep { white-space: nowrap; }
/* A table of the role key-column keeps room for a few words a line in its first column, the one
   a reader starts from: without it, at 1199px, "I need to" of crypto's decision table is three
   words wide, its other columns as wide as their names. Its names break after their :: and a
   path's / where it does not fit with them whole, and never between their other parts: where
   it does not fit even so, it stacks (the script below). A hyphenated word of its first
   column, `password-reset`, stays whole, as a matrix's key does (below). */
table.tableblock.key-column > tbody > tr > td:first-child { min-width: 10em; }
/* The first column of a matrix (postprocess.mjs), the key a reader finds a row by, such as a
   profile `native-single-on-native` or a dataset `1,000 members, 15-character keys`, keeps each
   of its words whole and room for a few of them a line: a row is then one line or two, not one
   line a part, and the matrix scrolls in its box. */
table.tableblock.matrix span.key, table.tableblock.key-column span.key { white-space: nowrap; }
table.tableblock.matrix > tbody > tr > td:first-child { min-width: 9em; }
/* A word of code longer than any line from 600px holds, code.long (postprocess.mjs), such as a
   linker's symbol, breaks between its parts at every width: kept whole, it would make the page
   wider than the screen. In a table it breaks as the table's box allows, as any name there. */
#content code.long, #content code.words > span.long { white-space: normal; }
@media screen and (min-width: 37.5em) {
  #content code.long span.wbr, #content code.words > span.long span.wbr { display: inline; }
}
/* The hyphens that open a flag stay with its first character (postprocess.mjs), at any width. */
#content code .lead { white-space: nowrap; }
/* A table too wide for the page, for a word of code it does not break, scrolls in its own box
   (postprocess.mjs), as a block of code does, and the page never gets wider than the screen. The
   box takes the table's margin and its white, so a table that fits shows as it did. An edge with
   more of the table beyond it has a shadow: each shadow stays at its edge of the box, and a white
   cover as wide moves with the table, hiding the shadow when the table's own edge is there. */
.table-scroll {
  overflow-x: auto;
  margin-bottom: 1.25em;
  background:
    linear-gradient(#fff, #fff) left / .75em 100% no-repeat,
    linear-gradient(#fff, #fff) right / .75em 100% no-repeat,
    radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, .18), transparent) left / .75em 100%
      no-repeat,
    radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, .18), transparent) right / .75em 100%
      no-repeat,
    #fff;
  background-attachment: local, local, scroll, scroll;
}
.table-scroll > table.tableblock { margin-bottom: 0; background: none; }
/* On a phone, a table's rows stack: each row is a box with a frame, each cell a block under the
   one before it, and the row of headers is hidden. A table of three columns or more shows each
   column's header above its cell, from the data-label postprocess.mjs gives the cell; a table of
   two columns, a name and what it is, reads stacked without them. */
@media screen and (max-width: 56.1875em) {
  table.tableblock, table.tableblock > tbody, table.tableblock > tbody > tr,
  table.tableblock > tbody > tr > td, table.tableblock > tbody > tr > th {
    display: block; width: auto;
  }
  table.tableblock > thead, table.tableblock > colgroup { display: none; }
  table.tableblock { border-width: 0; }
  table.tableblock > tbody > tr { border: 1px solid #dedede; margin-bottom: .75em; }
  table.tableblock > tbody > tr:last-child { margin-bottom: 0; }
  table.grid-all > tbody > tr > * { border-width: 0; }
  table.tableblock > tbody > tr > * + * { padding-top: 0; }
  table.tableblock td[data-label]::before {
    content: attr(data-label); display: block; font-weight: 600; font-size: .875em;
    color: rgba(0, 0, 0, .8); margin-bottom: .125em;
  }
  /* A note's label stands above its text, which keeps the width of the page. */
  .admonitionblock > table, .admonitionblock > table > tbody, .admonitionblock > table > tbody > tr,
  .admonitionblock > table > tbody > tr > td { display: block; width: auto; }
  .admonitionblock > table td.icon { text-align: left; padding: 0 0 .25em; }
  .admonitionblock > table td.content { padding: 0 0 0 .75em; }
}
/* Wider than a phone, a table whose columns do not fit the page even with its names broken
   between their parts stacks its rows as a phone's do: the script below marks its box stacked,
   since only a measure tells whether a table fits. A table that fits is laid out as a table;
   without the script, one that does not scrolls in its box. A matrix, a table of eight columns
   or more such as a benchmark's or a profile's, which postprocess.mjs marks, is read down its
   columns as much as along its rows: stacked, each row would be a card of eight lines or more
   and its columns could no longer be compared, so wider than a phone it stays a table and
   scrolls in its box. */
.table-scroll.stacked > table.tableblock, .table-scroll.stacked > table.tableblock > tbody,
.table-scroll.stacked > table.tableblock > tbody > tr,
.table-scroll.stacked > table.tableblock > tbody > tr > td,
.table-scroll.stacked > table.tableblock > tbody > tr > th { display: block; width: auto; }
.table-scroll.stacked > table.tableblock > thead,
.table-scroll.stacked > table.tableblock > colgroup { display: none; }
.table-scroll.stacked > table.tableblock { border-width: 0; }
.table-scroll.stacked > table.tableblock > tbody > tr {
  border: 1px solid #dedede; margin-bottom: .75em;
}
.table-scroll.stacked > table.tableblock > tbody > tr:last-child { margin-bottom: 0; }
.table-scroll.stacked > table.grid-all > tbody > tr > * { border-width: 0; }
.table-scroll.stacked > table.tableblock > tbody > tr > * + * { padding-top: 0; }
.table-scroll.stacked > table.tableblock td[data-label]::before {
  content: attr(data-label); display: block; font-weight: 600; font-size: .875em;
  color: rgba(0, 0, 0, .8); margin-bottom: .125em;
}
</style>
<script>
// Fits each table to its box in steps, as only a measure tells whether a table fits: a table
// wider than its box with its names whole is marked names, which the style breaks after their
// ::; one wider than its box even so, parts, which the style breaks between their other parts
// too, but one of the role key-column, whose names a reader copies from it, which stacks rather
// than break them so; one wider than its box even so, stacked, which the style lays out as a
// phone's stacked rows, but a matrix (postprocess.mjs), which scrolls in its box (the style says
// why); and a
// table laid out as stacked rows, by the script or by a phone's style, still wider than its box,
// loose, whose code the style then lets wrap where it must. It measures once the page is read,
// again once its images and fonts have loaded, which change the widths without a resize, and at
// each resize: every mark is cleared first, so that a table that fits again, the window widened,
// is a table again with its names whole; each step measures every box before it marks any,
// which lays the page out once a step.
(() => {
  const STEPS = ['names', 'parts', 'stacked', 'loose'];
  const wide = (box) => box.scrollWidth > box.clientWidth + 1;
  const matrix = (box) => box.firstElementChild.classList.contains('matrix');
  const keyed = (box) => box.firstElementChild.classList.contains('key-column');
  const rows = (box) => getComputedStyle(box.firstElementChild).display === 'block';
  const mark = (boxes, step) => {
    boxes.forEach((box) => box.classList.add(step));
    return boxes.filter(wide);
  };
  const fit = () => {
    const boxes = [...document.querySelectorAll('div.table-scroll')];
    boxes.forEach((box) => box.classList.remove(...STEPS));
    const named = mark(boxes.filter(wide), 'names');
    const parted = [...named.filter(keyed), ...mark(named.filter((box) => !keyed(box)), 'parts')];
    const stacked = mark(parted.filter((box) => !matrix(box)), 'stacked');
    mark([...new Set([...stacked, ...parted.filter(rows)])].filter(wide), 'loose');
  };
  addEventListener('DOMContentLoaded', fit);
  addEventListener('load', fit);
  addEventListener('resize', fit);
  document.fonts?.ready.then(fit);
})();
</script>
